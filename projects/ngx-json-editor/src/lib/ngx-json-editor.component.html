<div class="nje-editor">
	<!-- Header -->
	<div class="nje-header">
		<div class="nje-header__top">
			<ngx-json-editor-controls
				[config]="config()"
				[labels]="labels"
				[hasFolds]="hasFolds"
				(format)="formatJson()"
				(minify)="minifyJson()"
				(sort)="sortKeysAlphabetically()"
				(toggleSearch)="toggleSearch()"
				(copy)="copyToClipboard()"
				(download)="downloadJson()"
				(reset)="resetEditor()"
				(load)="handleFileUpload($event)"
				(foldAll)="foldAll()"
				(unfoldAll)="unfoldAllRegions()">
			</ngx-json-editor-controls>
			<span class="nje-badge" [class.nje-badge--valid]="isValid" [class.nje-badge--error]="!isValid">
				{{ isValid ? labels.valid : labels.error }}
			</span>
		</div>
		<ngx-json-search
			[show]="showSearch"
			[searchTerm]="searchTerm"
			[totalMatches]="totalMatches"
			[currentMatchIndex]="currentMatchIndex"
			[labels]="labels"
			(searchTermChange)="onSearchTermChange($event)"
			(next)="goToNextMatch()"
			(prev)="goToPreviousMatch()"
			(close)="closeSearch()">
		</ngx-json-search>
	</div>

	<!-- Body -->
	<div class="nje-body">
		<!-- Line numbers gutter -->
		<div class="nje-gutter" #gutterEl>
			@for (num of lineNumbers; track num) {
			<div class="nje-gutter__line" 
				 [class.nje-gutter__line--error]="num === errorLine"
				 [title]="num === errorLine ? error : ''">
				@if (isFoldableLine(num)) {
				<button class="nje-gutter__fold-btn"
					(mousedown)="$event.preventDefault()"
					(click)="toggleFold(num)"
					[title]="isFoldedLine(num) ? labels.unfoldAll : labels.foldAll">
					{{ isFoldedLine(num) ? '▶' : '▼' }}
				</button>
				}
				<span class="nje-gutter__num">{{ num }}</span>
			</div>
			}
		</div>

		<!-- Editor area -->
		<div class="nje-editor-area">
			@if (searchTerm) {
			<div #highlightOverlay
				 class="nje-highlight-overlay"
				 [innerHTML]="highlightSearchTerm(jsonText, searchTerm, currentMatchIndex)">
			</div>
			}
			<div #codeEditor
				 class="nje-code"
				 [class.nje-code--error]="!isValid"
				 [class.nje-code--search]="!!searchTerm"
				 [attr.contenteditable]="disabled() ? 'false' : 'true'"
				 [attr.data-placeholder]="labels.placeholder"
				 spellcheck="false"
				 (input)="onEditorInput()"
				 (keydown)="handleKeyDown($event)"
				 (scroll)="syncScroll($event)"
				 (blur)="onBlur()">
			</div>
		</div>
	</div>

	<!-- Footer -->
	<div class="nje-footer">
		@if (searchTerm) {
		<span class="nje-footer__search">{{ getSearchMatches() }}</span>
		}
		<span class="nje-footer__info">
			{{ labels.lines }}: {{ jsonText.split('\n').length }}
		</span>
		<span class="nje-footer__info">
			{{ labels.characters }}: {{ jsonText.length }}
		</span>
	</div>
</div>
