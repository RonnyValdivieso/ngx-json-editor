<div class="nje-editor">
	<!-- Header -->
	<div class="nje-header">
		<div class="nje-header__top">
			<ngx-json-editor-controls
				[config]="config"
				[labels]="labels"
				(format)="formatJson()"
				(minify)="minifyJson()"
				(sort)="sortKeysAlphabetically()"
				(toggleSearch)="toggleSearch()"
				(copy)="copyToClipboard()"
				(download)="downloadJson()"
				(reset)="resetEditor()"
				(load)="handleFileUpload($event)">
			</ngx-json-editor-controls>
			<span class="nje-badge" [class.nje-badge--valid]="isValid" [class.nje-badge--error]="!isValid">
				{{ isValid ? labels.valid : labels.error }}
			</span>
		</div>
		<ngx-json-search
			[show]="showSearch"
			[searchTerm]="searchTerm"
			[totalMatches]="totalMatches"
			[currentMatchIndex]="currentMatchIndex"
			[labels]="labels"
			(searchTermChange)="onSearchTermChange($event)"
			(next)="goToNextMatch()"
			(prev)="goToPreviousMatch()"
			(close)="closeSearch()">
		</ngx-json-search>
	</div>

	<!-- Body -->
	<div class="nje-body">
		<!-- Line numbers gutter -->
		<div class="nje-gutter" #gutterEl>
			<div class="nje-gutter__line" *ngFor="let num of lineNumbers">{{ num }}</div>
		</div>

		<!-- Editor area -->
		<div class="nje-editor-area">
			<div *ngIf="searchTerm" #highlightOverlay
				 class="nje-highlight-overlay"
				 [innerHTML]="highlightSearchTerm(jsonText, searchTerm, currentMatchIndex)">
			</div>
			<textarea #jsonArea
				[(ngModel)]="jsonText"
				(ngModelChange)="onJsonTextChange($event)"
				(keydown)="handleKeyDown($event)"
				(scroll)="syncScroll($event)"
				[placeholder]="labels.placeholder"
				[class.nje-textarea--error]="!isValid"
				class="nje-textarea"
				spellcheck="false">
			</textarea>
		</div>
	</div>

	<!-- Footer -->
	<div class="nje-footer">
		<span *ngIf="searchTerm" class="nje-footer__search">{{ getSearchMatches() }}</span>
		<span class="nje-footer__info">
			{{ labels.lines }}: {{ jsonText.split('\n').length }}
		</span>
		<span class="nje-footer__info">
			{{ labels.characters }}: {{ jsonText.length }}
		</span>
	</div>
</div>
